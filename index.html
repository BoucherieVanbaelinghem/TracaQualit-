function lastOf(id){return D.derniers[id]||null}
function dueTemp(eq){var l=lastOf(eq.id);return l?addDays(l.date,1):today()}
function dueClean(t){var l=lastOf(t.id);return l?addDays(l.date,t.freq):today()}
function cleanStatus(t){var d=dueClean(t),td=today();return d<td?'retard':d===td?'afaire':'ok'}

function dlcState(x){var td=today();return x.dlc<td?'depasse':x.dlc===td?'aujourdhui':'ok'}

 var D0=addDays(today(),k),out=[];
 equip().forEach(function(eq){var due=dueTemp(eq);out.push({mod:'temp',title:eq.name,sub:eq.kind==='cong'?'Congélation':'Réfrigération',due:due,open:function(){openTemp(eq)}})});
 ZONES.forEach(function(z){z.tasks.forEach(function(t){out.push({mod:'clean',title:t.name,sub:z.name,due:dueClean(t),open:function(){openClean(t)}})})});
 D.catalogue.forEach(function(x){if((x.module==='gaz'||x.module==='refroid')&&x.planDate){var done=D.releves.some(function(r){return r.module===x.module&&r.label===x.name&&r.date>=x.planDate});if(!done)out.push({mod:x.module,title:x.name,sub:x.cat||'',due:x.planDate,open:function(){if(x.module==='gaz')openGaz(x);else openRefroid(x)}})}});
 out.forEach(function(i){i.col=i.due<D0?'retard':i.due===D0?'faire':(i.due<=addDays(D0,7)?'venir':'')});
 return out.filter(function(i){return i.col});
}
function counts(){
 var td=today(),c={plan:0,temp:0,clean:0,dlc:0,liv:D.sessions.length};
 equip().forEach(function(eq){if(dueTemp(eq)<=td){c.temp++;c.plan++}});
 ZONES.forEach(function(z){z.tasks.forEach(function(t){if(dueClean(t)<=td){c.clean++;c.plan++}})});
 D.dlc.forEach(function(x){if(x.dlc<td)c.dlc++});
 return c;
}

function playAlarm(name){
 if(!name||!ALP[name])return 0;
 try{var A=window.AudioContext||window.webkitAudioContext;if(!AUD)AUD=new A();var c=AUD,t=c.currentTime,total=0;
  ALP[name].forEach(function(n){if(n[0]){var o=c.createOscillator(),g=c.createGain();o.type=n[2]||'sine';o.frequency.value=n[0];g.gain.setValueAtTime(.18,t+total);g.gain.setValueAtTime(0,t+total+n[1]-.01);o.connect(g);g.connect(c.destination);o.start(t+total);o.stop(t+total+n[1])}total+=n[1]});return total}catch(e){return 0}}

 return d+' · '+when}

async function tfAction(a,v){

 if(a==='tfdel'){if(!TF.ask){TF.ask=true;tfDraw();return}await drop('rappels',TF.id);TF=null;fHide();toast('Élément supprimé.');return}
 if(a==='tfsave'){TF.show=true;if(Object.keys(tfErr()).length){tfDraw();return}
  var d2={name:TF.name.trim(),msg:TF.msg.trim(),alarm:TF.alarm,mode:TF.mode,kind:TF.kind};

var FIRED={},RING=null;
function rapDue(r,now){
 var hm=hhmm(now),td=today(),wd=(now.getDay()+6)%7;
 if(r.kind==='week'){if((r.days||[]).indexOf(wd)<0)return false}else if((r.date||td)!==td)return false;
 if(r.mode==='every'){var n=tmin(hm),f=tmin(r.from),t=tmin(r.to),e=r.every;return e>0&&n>=f&&n<=t&&(n-f)%e===0}
 return r.at===hm}

 var rows=histRows(),head=['Date','Heure','Moment','Module','Contrôle','Température','Arrivée','Points faits','Points total','État','Signature','Note','Lots'];

 DL.save({filename:'historique-qualite-'+today()+'.csv',data:'﻿'+lines.join('\r\n')}).then(function(){toast('Export enregistré.')},function(e){if(!e||e.code!=='declined')toast('Export impossible ('+((e&&e.code)||'erreur')+').')});
}

render();setInterval(tick,20000);initData();
